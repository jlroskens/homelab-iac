name: ➡️ Pull Request

on:
  - pull_request

permissions:
  id-token: write
  contents: write
  actions: read
jobs:
  pull-request:
    name: Pull Request
    uses: rNimbus-com/ci-workflows/.github/workflows/pr-tofu.yml@v1
    with:
      working-dir: proxmox/examples/virtual_machine,proxmox/examples/virtual_machine_cloud_init,proxmox/modules/proxmox_virtual_machine,proxmox/net_boot_vm,proxmox/pve_env_config,proxmox/pve_file_repository,proxmox/talos_cluster